<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Updates | SHANE</title><style>body{font:16px/1.55 system-ui;max-width:850px;margin:auto;padding:24px;background:#f4f8ff;color:#183957}header,article,section{background:white;border:1px solid #d7e2ef;border-radius:12px;padding:20px;margin:16px 0}header{background:linear-gradient(110deg,#285f9f,#7787ca);color:white}header a{color:white}button,select{padding:10px;border-radius:8px;font:inherit}button{background:#235e99;color:white;border:0;cursor:pointer}select{width:100%;max-width:600px}.muted{color:#52677d}article h3{margin-bottom:5px}a{color:#205f9c}</style><header><h1>My Community Updates</h1><nav><a href="index.html">SHANEnetwork</a> · <a href="communities.html">Manage communities</a> · <a href="members.html">Member account</a></nav></header><p>Announcements and events from communities you've joined, in one place. Private organization records are not shown here.</p><p id="status" role="status" aria-live="polite"></p><section><label for="org">Choose a community</label><select id="org"><option value="">All my communities</option></select><button id="refresh" type="button">Refresh updates</button></section><div id="feed" aria-live="polite"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';const sb=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB'),$=id=>document.getElementById(id);let user,orgs=[];async function init(){const{data:{user:current}}=await sb.auth.getUser();user=current;if(!user){$('status').textContent='Sign in using Member account to view your community updates.';return}const[owned,joined]=await Promise.all([sb.from('shane_organizations').select('id,name').eq('owner_id',user.id),sb.from('shane_organization_members').select('organization_id').eq('user_id',user.id)]);if(owned.error||joined.error){$('status').textContent='Unable to load communities: '+(owned.error||joined.error).message;return}const ids=[...new Set([...owned.data.map(x=>x.id),...joined.data.map(x=>x.organization_id)])];if(!ids.length){$('feed').textContent='No communities yet. Create one or accept an invitation.';return}const{data,error}=await sb.from('shane_organizations').select('id,name').in('id',ids);if(error){$('status').textContent=error.message;return}orgs=data;for(const item of orgs){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;$('org').append(option)}await refresh()}async function refresh(){if(!user||!orgs.length)return;const selected=$('org').value,ids=selected?[selected]:orgs.map(x=>x.id);const host=$('feed');host.textContent='Loading updates…';const{data,error}=await sb.from('shane_organization_posts').select('id,organization_id,kind,title,body,event_at,created_at').in('organization_id',ids).in('kind',['announcement','event']).order('created_at',{ascending:false}).limit(100);if(error){host.textContent='Unable to load updates: '+error.message;return}host.replaceChildren();if(!data.length){host.textContent='No announcements or events yet.';return}for(const item of data){const article=document.createElement('article'),title=document.createElement('h3'),meta=document.createElement('p'),body=document.createElement('p');title.textContent=item.title;const org=orgs.find(x=>x.id===item.organization_id);meta.className='muted';meta.textContent=(org?.name||'Community')+' · '+item.kind+' · '+(item.event_at?'Event: '+new Date(item.event_at).toLocaleString()+' · ':'')+'Posted '+new Date(item.created_at).toLocaleDateString();body.textContent=item.body;article.append(title,meta,body);host.append(article)}}$('refresh').onclick=refresh;$('org').onchange=refresh;init();</script></html>
