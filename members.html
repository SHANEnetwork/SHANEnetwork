<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHANE Members & Listings</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:auto;padding:24px;color:#142d4c;background:#f5f7fb}section{background:white;border:1px solid #d6deeb;border-radius:12px;padding:20px;margin:20px 0}label{display:block;margin:12px 0}input,textarea,select{display:block;width:100%;padding:10px;box-sizing:border-box}button{padding:10px;margin:6px 5px 6px 0;cursor:pointer}article{padding:12px;border-bottom:1px solid #ddd}#status{min-height:1.5em}a{color:#164f91}</style></head><body><p><a href="index.html">← SHANEnetwork home</a></p><h1>Members & public listings</h1><p>Member profiles are private by default. Only listings you explicitly publish appear in the public directory.</p><p id="status" role="status" aria-live="polite"></p><section><h2>Member account</h2><form id="auth"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Sign in</button><button id="signup" type="button">Create account</button><button id="signout" type="button">Sign out</button></form><p id="session"></p></section><section id="profileSection" hidden><h2>Your profile</h2><form id="profile"><label>Display name<input id="display" required maxlength="100"></label><label>Region<input id="region" maxlength="150"></label><label>About<textarea id="bio"></textarea></label><label><input type="checkbox" id="visible"> Make my profile publicly visible</label><button>Save profile</button></form></section><section id="listingSection" hidden><h2>Create listing</h2><form id="listing"><label>Title<input id="title" maxlength="150" required></label><label>Category<select id="category"><option>business</option><option>project</option><option>service</option><option>person</option><option>organization</option><option>event</option><option>opportunity</option></select></label><label>Description<textarea id="description"></textarea></label><label>Region<input id="listingRegion"></label><label>Website URL<input id="website" type="url" placeholder="https://example.com"></label><label><input type="checkbox" id="attribution"> I confirm I have permission to publish this information</label><label>Status<select id="publication"><option value="draft">Private draft</option><option value="published">Publish publicly</option><option value="unlisted">Unlisted</option></select></label><button>Create listing</button></form></section><section><h2>Public directory</h2><button id="refresh">Refresh listings</button><div id="results" aria-live="polite"></div></section><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';
const sb=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB');
const $=id=>document.getElementById(id), say=m=>$('status').textContent=m;
async function current(){const {data:{user}}=await sb.auth.getUser();$('session').textContent=user?'Signed in: '+user.email:'Not signed in';$('profileSection').hidden=!user;$('listingSection').hidden=!user;if(user){const {data}=await sb.from('shane_profiles').select('*').eq('user_id',user.id).maybeSingle();$('display').value=data?.display_name||'';$('region').value=data?.region||'';$('bio').value=data?.bio||'';$('visible').checked=!!data?.visible}return user}
$('auth').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});say(error?.message||'Signed in');await current()};
$('signup').onclick=async()=>{const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});say(error?.message||'Account requested. Check email for confirmation if required.');await current()};
$('signout').onclick=async()=>{await sb.auth.signOut();say('Signed out');await current()};
$('profile').onsubmit=async e=>{e.preventDefault();const u=await current();if(!u)return;const {error}=await sb.from('shane_profiles').upsert({user_id:u.id,display_name:$('display').value.trim(),region:$('region').value.trim(),bio:$('bio').value,visible:$('visible').checked});say(error?.message||'Profile saved')};
$('listing').onsubmit=async e=>{e.preventDefault();const u=await current();if(!u)return;const status=$('publication').value,confirmed=$('attribution').checked;if(status==='published'&&!confirmed){say('Confirm permission before publishing.');return}const {error}=await sb.from('shane_listings').insert({owner_id:u.id,title:$('title').value.trim(),category:$('category').value,description:$('description').value,region:$('listingRegion').value.trim(),website_url:$('website').value.trim()||null,status,attribution_confirmed:confirmed});say(error?.message||'Listing saved');if(!error){$('listing').reset();await directory()}};
async function directory(){const host=$('results');host.replaceChildren();const {data,error}=await sb.from('shane_listings').select('id,title,category,description,region,website_url,created_at').eq('status','published').order('created_at',{ascending:false}).limit(100);if(error){say(error.message);return}if(!data?.length){host.textContent='No public listings yet.';return}for(const x of data){const a=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p');h.textContent=x.title;p.textContent=[x.category,x.region,x.description].filter(Boolean).join(' · ');a.append(h,p);if(x.website_url){try{const u=new URL(x.website_url);if(['https:','http:'].includes(u.protocol)){const link=document.createElement('a');link.href=u.href;link.textContent='Visit website';link.target='_blank';link.rel='noopener noreferrer';a.append(link)}}catch{}}host.append(a)}}
$('refresh').onclick=directory;await current();await directory();
</script></body></html>
