<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHANE System Health</title><style>body{font:16px/1.5 system-ui;max-width:850px;margin:auto;padding:24px;background:#f5f8ff;color:#173858}section{background:white;padding:20px;margin:18px 0;border-radius:12px}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0}button{padding:12px;background:#225e9a;color:white;border:0;border-radius:8px}article{border-top:1px solid #ddd;padding:12px 0}</style><a href="communities.html">My Communities</a><h1>System Health</h1><p>Owner-only incident register. Automated detection, diagnosis, alerts and repairs are not yet enabled.</p><section><label>Organization<select id="org"></select></label><h2>Report an issue</h2><form id="report"><label>Title<input id="title" required maxlength="200"></label><label>Severity<select id="severity"><option>minor</option><option>moderate</option><option>critical</option></select></label><label>Details<textarea id="description" maxlength="4000"></textarea></label><button type="submit">Record incident</button></form><p id="status" role="status"></p></section><section><h2>Incidents</h2><div id="incidents"></div></section><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB'),$=x=>document.getElementById(x);let user;
async function load(){const id=$('org').value;$('incidents').replaceChildren();if(!id)return;const r=await db.from('shane_system_incidents').select('id,title,description,severity,status,created_at,resolution_note,diagnosis,recommendation,verified_at').eq('organization_id',id).order('created_at',{ascending:false}).limit(100);if(r.error){$('status').textContent=r.error.message;return}for(const item of r.data){const a=document.createElement('article');for(const [tag,value] of [['h3',item.title],['p',item.severity+' · '+item.status+' · '+new Date(item.created_at).toLocaleString()],['p',item.description]]){const n=document.createElement(tag);n.textContent=value;a.append(n)}const control=document.createElement('div');for(const action of (item.status==='resolved'?['reopen']:['investigate','resolve'])){const b=document.createElement('button');b.textContent=action==='resolve'?'Record resolution':action==='reopen'?'Reopen':'Investigate';b.onclick=async()=>{const details=prompt('Document the action or evidence (resolution requires details):','');if(details===null)return;const result=await db.rpc('shane_manage_incident',{p_incident_id:item.id,p_action:action,p_details:details});$('status').textContent=result.error?result.error.message:'Incident updated';if(!result.error)await load()};control.append(b)}if(item.status==='resolved'&&!item.verified_at){const v=document.createElement('button');v.textContent='Record verification evidence';v.onclick=async()=>{const evidence=prompt('Describe independent checks performed and results (minimum 12 characters):','');if(evidence===null)return;const r=await db.rpc('shane_verify_incident',{p_incident_id:item.id,p_evidence:evidence});$('status').textContent=r.error?r.error.message:'Verification evidence recorded';if(!r.error)await load()};control.append(v)}if(item.verified_at){const verified=document.createElement('p');verified.textContent='Verification recorded: '+new Date(item.verified_at).toLocaleString()+' (owner-provided evidence, not automated independent testing)';a.append(verified)}const history=document.createElement('button');history.textContent='View audit history';history.onclick=async()=>{const r=await db.rpc('shane_incident_history',{p_incident_id:item.id});if(r.error){$('status').textContent=r.error.message;return}let panel=a.querySelector('pre');if(panel){panel.remove();return}panel=document.createElement('pre');panel.style.whiteSpace='pre-wrap';panel.textContent=(r.data||[]).map(e=>new Date(e.created_at).toLocaleString()+' · '+e.event_type+' · '+e.details).join('\n')||'No recorded events';a.append(panel)};control.append(history);a.append(control);$('incidents').append(a)}}
const auth=await db.auth.getUser();user=auth.data.user;if(!user){$('status').textContent='Sign in from Members first.'}else{const r=await db.from('shane_organizations').select('id,name').eq('owner_id',user.id);if(r.error)$('status').textContent=r.error.message;else{for(const o of r.data)$('org').append(new Option(o.name,o.id));$('org').onchange=load;await load()}}
$('report').onsubmit=async e=>{e.preventDefault();if(!user||!$('org').value)return;const r=await db.from('shane_system_incidents').insert({organization_id:$('org').value,reported_by:user.id,title:$('title').value.trim(),description:$('description').value.trim(),severity:$('severity').value});$('status').textContent=r.error?r.error.message:'Incident recorded';if(!r.error){$('report').reset();await load()}}
</script></html>
