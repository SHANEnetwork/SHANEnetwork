name: SHANE responsive browser verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'network.html'
      - 'shane-family-bridge.js'
      - 'shane-family-design.css'
      - 'assets/**'
      - 'tests/shane-responsive-browser.cjs'
      - 'tests/shane-account-handoff-browser.cjs'
      - '.github/workflows/shane-responsive-browser.yml'
jobs:
  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shane-http.log 2>&1 &
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8765/network.html >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/shane-http.log
          exit 1
      - name: Verify phone and laptop layouts
        run: node tests/shane-responsive-browser.cjs
      - name: Verify private account handoff with controlled auth scenarios
        run: node tests/shane-account-handoff-browser.cjs
      - name: Save screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shane-responsive-screenshots
          path: test-artifacts/responsive/
          if-no-files-found: ignore
