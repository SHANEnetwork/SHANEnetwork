name: SHANE deployed navigation smoke
on:
  workflow_dispatch:
concurrency:
  group: shane-deployed-navigation-smoke
  cancel-in-progress: true
jobs:
  chromium-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHANE_E2E_URL: https://shanenetwork.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify deployed pages and homepage navigation
        run: node tests/shane-deployed-navigation.cjs
