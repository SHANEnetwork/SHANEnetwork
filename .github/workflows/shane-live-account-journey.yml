name: SHANE live account journey (explicit test account only)
on:
  workflow_dispatch:
concurrency:
  group: shane-dedicated-live-account-journey
  cancel-in-progress: false
jobs:
  account-journey:
    if: ${{ vars.SHANE_ENABLE_LIVE_E2E == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHANE_E2E_EMAIL: ${{ secrets.SHANE_E2E_EMAIL }}
      SHANE_E2E_PASSWORD: ${{ secrets.SHANE_E2E_PASSWORD }}
      SHANE_E2E_URL: https://shanenetwork.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Supabase test client (not a browser)
        run: |
          npm install --no-save --no-package-lock @supabase/supabase-js@2.57.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify dedicated account is configured
        run: |
          test -n "$SHANE_E2E_EMAIL" || { echo 'Dedicated test email secret is missing'; exit 1; }
          test -n "$SHANE_E2E_PASSWORD" || { echo 'Dedicated test password secret is missing'; exit 1; }
      - name: Run signed-in database persistence checks (not browser E2E)
        run: node tests/shane-live-account-browser.cjs
      - name: Check deployed navigation in Chromium (not signed-in journey)
        run: node tests/shane-deployed-navigation.cjs
      - name: Upload safe diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shane-live-e2e-diagnostics
          path: test-artifacts/live-e2e/
          if-no-files-found: ignore
