name: SHANE internal link audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: shane-internal-links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local HTML links and assets
        run: node tests/shane-internal-links.cjs
