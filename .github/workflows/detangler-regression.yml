name: Detangler Regression
on:
  pull_request:
    paths:
      - 'shane-detangler-core.js'
      - 'shane-detangler-acquisition.cjs'
      - 'tests/detangler-*.test.cjs'
      - '.github/workflows/detangler-regression.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/detangler-core.test.cjs tests/detangler-source-audit.test.cjs tests/detangler-acquisition.test.cjs
