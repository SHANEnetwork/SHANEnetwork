name: SHANE website lifecycle checks
on:
  push:
    paths:
      - 'builder.html'
      - 'site.html'
      - 'dashboard.html'
      - 'tests/website-lifecycle.cjs'
      - '.github/workflows/website-lifecycle.yml'
  pull_request:
    paths:
      - 'builder.html'
      - 'site.html'
      - 'dashboard.html'
      - 'tests/website-lifecycle.cjs'
      - '.github/workflows/website-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Check website lifecycle contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency-free regression checks
        run: node tests/website-lifecycle.cjs
