name: Validate SHANE pages
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax and basic page wiring
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const pages=['index.html','builder.html','members.html','site.html','campaigns.html','payments.html','request-build.html','growth.html','contact.html'];
          let checked=0;
          for(const file of pages){
            if(!fs.existsSync(file))throw new Error('Missing '+file);
            const html=fs.readFileSync(file,'utf8');
            for(const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
              const [,attrs,code]=match;
              if(!code.trim()||/\bsrc\s*=/.test(attrs))continue;
              const result=spawnSync(process.execPath,['--check','--input-type=module'],{input:code,encoding:'utf8'});
              if(result.status!==0){const line=html.slice(0,match.index).split('\n').length;throw new Error(file+' inline script beginning at HTML line '+line+': '+result.stderr)}
              checked++;
            }
          }
          for(const [file,needles] of Object.entries({
            'site.html':['shane_sites','status','published'],
            'members.html':['shane_collaboration_messages','shane_collaboration_requests'],
            'index.html':['id="shaneWelcome"','id="welcomePreview"','shane-welcome-v1','request-build.html'],
            'builder.html':['id="publishSite"','id="unpublishSite"','shane_sites','site.html','shane-welcome-v1','shane_endeavor_milestones']
          })){
            const html=fs.readFileSync(file,'utf8');
            for(const needle of needles)if(!html.includes(needle))throw new Error(file+' missing '+needle);
          }
          const builder=fs.readFileSync('builder.html','utf8');
          const viewer=fs.readFileSync('site.html','utf8');
          const generator=builder.slice(builder.indexOf('function build(includeAdditionalPages=true){'),builder.indexOf('function buildMultiPage(){'));
          if(!generator.includes('</body></html>'))throw new Error('Builder export HTML template closing structure missing');
          if(!builder.includes('const original=build(false)'))throw new Error('Multi-page export must omit additional page content from homepage');

          // Exercise the real generator with a minimal DOM stub to catch broken exports.
          const scriptBlocks=[...builder.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          const source=scriptBlocks.map(m=>m[2]).find(s=>s.includes('function build(includeAdditionalPages=true){'));
          if(!source)throw new Error('Website generator script not found');
          const start=source.indexOf('function esc(');
          const end=source.indexOf('function buildMultiPage(){');
          if(start<0||end<start)throw new Error('Cannot isolate generator for export test');
          const {runInNewContext}=await import('node:vm');
          const fields={business:'Example Studio',tagline:'An example',about:'About our work',services:['Design','Research'].join(String.fromCharCode(10)),pages:['Portfolio | Portfolio content','Events | Events content'].join(String.fromCharCode(10)),email:'hello@example.com',color:'#2458a6',brandColor:'#2458a6',brandFont:'modern',backgroundStyle:'default',backgroundColor:'#ffffff',backgroundColor2:'#eeeeee'};
          const nodes=Object.fromEntries(Object.entries(fields).map(([id,value])=>[id,{value,checked:false}]));
          nodes.contact={checked:true};nodes.useBrandColor={checked:false};
          const run=runInNewContext('const $=id=>document.getElementById(id);'+source.slice(start,end)+';({build,esc})',{document:{getElementById:id=>nodes[id]},Date},{timeout:2000});
          const one=run.build();
          const home=run.build(false);
          if(!one.includes('Portfolio content')||!one.includes('Events content'))throw new Error('Single-page export lost additional content');
          if(home.includes('Portfolio content')||home.includes('Events content'))throw new Error('Multi-page homepage duplicates additional content');
          if(!home.includes('About our work')||!home.includes('What we offer'))throw new Error('Multi-page homepage lost core content');
          if(!one.includes('mailto:hello@example.com'))throw new Error('Website contact link missing');

          // Verify reusable modules survive generation and escape untrusted text.
          nodes.faq={value:'How does it work? | Open the details to learn more.'};
          nodes.testimonials={value:'Excellent collaboration | A participant'};
          nodes.gallery={value:'https://example.org/gallery.jpg | Community gathering'};
          nodes.callToAction={value:'Join us | https://example.org/join'};
          const featured=run.build();
          for(const expected of ['<details>','How does it work?','Excellent collaboration','Community gathering','gallery.jpg','Join us','https://example.org/join']){
            if(!featured.includes(expected))throw new Error('Website export missing module: '+expected);
          }
          const featuredHome=run.build(false);
          if(!featuredHome.includes('Community gathering')||!featuredHome.includes('How does it work?'))throw new Error('Multi-page homepage lost reusable components');
          nodes.faq.value='<img src=x onerror=alert(1)> | A safe answer';
          nodes.testimonials.value='<script>alert(1)</script> | A participant';
          const escaped=run.build();
          if(escaped.includes('<img src=x')||escaped.includes('<script>alert(1)</script>'))throw new Error('User-provided module text was not HTML-escaped');
          nodes.callToAction.value='Unsafe link | javascript:alert(1)';
          if(run.build().includes('href="javascript:'))throw new Error('Unsafe CTA URL was included in export');
          nodes.callToAction.value='Join us | https://example.org/join';
          for(const id of ['faq','testimonials','gallery','callToAction'])if(!builder.includes('id="'+id+'"'))throw new Error('Builder missing reusable component field '+id);
          for(const id of ['faq','testimonials','gallery','callToAction'])if(!viewer.includes('c.'+id))throw new Error('Published viewer missing reusable component '+id);

          // All three saved website layout choices must affect generated HTML.
          nodes.layoutStyle={value:'classic'};
          const classic=run.build();
          nodes.layoutStyle.value='minimal';
          const minimal=run.build();
          nodes.layoutStyle.value='bold';
          const bold=run.build();
          if(classic===minimal||classic===bold||minimal===bold)throw new Error('Website layout choices generated identical HTML');
          if(!minimal.includes('max-width:760px')||!bold.includes('max-width:1050px'))throw new Error('Website layout CSS missing');
          if(!builder.includes('content.layoutStyle=')||!builder.includes('id="layoutStyle"'))throw new Error('Website layout is not persisted');
          if(!viewer.includes('c.layoutStyle'))throw new Error('Published website viewer ignores layout choice');
          nodes.layoutStyle.value='classic';

          // Exercise the readiness checker against valid and invalid website data.
          const readinessStart=source.indexOf('function websiteReadiness(){');
          const readinessEnd=source.indexOf('function showWebsiteReadiness(){');
          if(readinessStart<0||readinessEnd<readinessStart)throw new Error('Readiness checker missing');
          if(!source.includes('go.onclick=()=>{target.scrollIntoView')||!source.includes('go.setAttribute("aria-label","Edit "+check.name)'))throw new Error('Readiness report must navigate directly to editable issues');
          if(source.includes("document.getElementById('auditWebsite').onclick="))throw new Error('Legacy readiness handler must not compete with the actionable checker');
          if(!source.includes('readinessRefreshTimer=setTimeout(showWebsiteReadiness,350)'))throw new Error('Readiness report must refresh while website fields change');
          if(!builder.includes('id="openPreviewTab"')||!source.includes('window.open(url,"_blank","noopener")'))throw new Error('Full-size page preview must remain available');
          if(!builder.includes('id="workspaceReadiness"')||!builder.includes('id="workspaceCheck"')||!source.includes('function updateWorkspaceReadiness(){'))throw new Error('Project workspace must show actionable launch readiness');
          for(const id of ['workspaceJourney','journeyCreate','journeyReview','journeySave','journeyPublish'])if(!builder.includes('id="'+id+'"'))throw new Error('Project launch journey missing '+id);
          if(!source.includes('function updateJourney(){')||!source.includes('target.append(a);updateJourney()'))throw new Error('Project journey must reflect saved and published state');
          if(!source.includes('.select("id,content,status,slug")')||!source.includes('updateWorkspacePublicLink(data.status==="published"&&data.slug?data.slug:null)'))throw new Error('Opening a saved public project must preserve its published link');
          if(!source.includes('const unpublishSiteId=selectedSiteId')||!source.includes('.eq("id",unpublishSiteId)')||!source.includes('if(selectedSiteId===unpublishSiteId)updateWorkspacePublicLink(null)'))throw new Error('Unpublish must target the original project despite asynchronous selection changes');
          if(!source.includes('if(document.getElementById("savedSites").value!==id)')||!source.includes('if(!data||!data.content)'))throw new Error('Saved project loading must reject stale selections and missing content');
          if(!source.includes('let refreshSitesSequence=0;')||!source.includes('const refreshSequence=++refreshSitesSequence')||!source.includes('if(refreshSequence!==refreshSitesSequence)return'))throw new Error('Overlapping project refreshes must ignore stale responses');
          if(!source.includes('Saved the earlier editor version. You have newer unsaved edits')||!source.includes('Newer editor changes remain unsaved and are not published.'))throw new Error('Save and publish must warn about edits made during asynchronous requests');
          if(!source.includes('const hasContent=!!(')||!source.includes('["journeyCreate",hasContent]'))throw new Error('Launch journey should not mark a blank website as created');
          const publicViewer=fs.readFileSync('site.html','utf8');
          for(const token of ['id="sharePage"','id="shareStatus"','navigator.share','navigator.clipboard.writeText','pages[n].title+" | "'])if(!publicViewer.includes(token))throw new Error('Public website sharing or page title missing: '+token);
          for(const name of ['Additional page limit','Page content','Unique page names'])if(!source.includes('"'+name+'"'))throw new Error('Readiness report must check '+name);
          for(const name of ['Starter content','Gallery image links'])if(!source.includes('"'+name+'"'))throw new Error('Readiness report must check '+name);
          const audit=runInNewContext(source.slice(readinessStart,readinessEnd)+';websiteReadiness',{document:{getElementById:id=>nodes[id]},URL},{timeout:2000});
          nodes.pages.value='';
          nodes.business.value='Example Studio';
          nodes.tagline.value='Design and research for communities';
          nodes.about.value='We work with community partners to design, research, and deliver thoughtful projects for real people.';
          nodes.services.value='Design';
          nodes.email.value='hello@example.com';
          nodes.gallery.value='https://example.org/photo.jpg | Community gathering';
          if(audit().some(x=>!x.ok))throw new Error('Readiness checker rejected sample: '+audit().filter(x=>!x.ok).map(x=>x.name).join(', '));
          nodes.email.value='not-an-email';
          if(audit().find(x=>x.name==='Contact')?.ok!==false)throw new Error('Readiness checker missed invalid contact email');
          nodes.email.value='hello@example.com';
          nodes.gallery.value='https://example.org/photo.jpg';
          if(audit().find(x=>x.name==='Gallery descriptions')?.ok!==false)throw new Error('Readiness checker missed missing image description');
          nodes.gallery.value='https://example.org/photo.jpg | Community gathering';
          nodes.pages.value=fields.pages;

          // Also execute multi-page generation and verify filenames, navigation, and content isolation.
          const multiSource=source.slice(start,source.indexOf('function downloadMultiPage(){'));
          const multi=runInNewContext('const $=id=>document.getElementById(id);'+multiSource+';({buildMultiPage})',{document:{getElementById:id=>nodes[id]},Date},{timeout:2000});
          const exported=multi.buildMultiPage();
          nodes.layoutStyle.value='minimal';
          const minimalPages=multi.buildMultiPage();
          if(!minimalPages.every(p=>p.html.includes('max-width:760px')))throw new Error('Minimal layout lost on an exported page');
          nodes.layoutStyle.value='bold';
          const boldPages=multi.buildMultiPage();
          if(!boldPages.every(p=>p.html.includes('max-width:1050px')))throw new Error('Bold layout lost on an exported page');
          nodes.layoutStyle.value='classic';
          if(exported.length!==3)throw new Error('Expected homepage and two additional HTML pages');
          if(exported.map(p=>p.filename).join(',')!=='index.html,portfolio.html,events.html')throw new Error('Multi-page export filenames incorrect');
          if(!exported[0].html.includes('href="portfolio.html"')||!exported[0].html.includes('href="events.html"'))throw new Error('Homepage navigation links missing');
          if(exported[0].html.includes('Portfolio content')||exported[0].html.includes('Events content'))throw new Error('Multi-page homepage contains page body content');
          if(!exported[1].html.includes('Portfolio content')||exported[1].html.includes('Events content'))throw new Error('Portfolio page content isolation failed');
          if(!exported[2].html.includes('Events content')||exported[2].html.includes('Portfolio content'))throw new Error('Events page content isolation failed');
          nodes.pages.value=['Portfolio | First','Portfolio | Second'].join(String.fromCharCode(10));
          const duplicates=multi.buildMultiPage();
          if(duplicates[1].filename===duplicates[2].filename)throw new Error('Duplicate page titles overwrite export files');

          // Validate that the ZIP exporter uses the standard ZIP headers and correct CRC-32.
          const zipSource=source.slice(source.indexOf('function crc32(bytes){'),source.indexOf('function update(silent=false){'));
          if(!zipSource.startsWith('function crc32(bytes){'))throw new Error('ZIP checksum helper missing');
          const checksum=runInNewContext(zipSource+';crc32',{},{timeout:2000});
          const known=new TextEncoder().encode('123456789');
          if(checksum(known)!==0xcbf43926)throw new Error('ZIP CRC-32 failed known test vector');
          if(!builder.includes('id="downloadPagesZip"')||!builder.includes('0x04034b50')||!builder.includes('0x02014b50')||!builder.includes('0x06054b50'))throw new Error('ZIP download wiring or archive headers missing');

          // Exercise the ZIP download handler and validate the archive with Python's ZIP reader.
          const {writeFileSync}=await import('node:fs');
          const zipHandler=source.slice(source.indexOf('document.getElementById("downloadPagesZip").onclick='),source.indexOf('function update(silent=false){'));
          const mockButton={disabled:false};
          let savedBlob=null;
          const fakeUrl={createObjectURL:blob=>{savedBlob=blob;return 'blob:smoke'},revokeObjectURL:()=>{}};
          const fakeDocument={getElementById:id=>id==='downloadPagesZip'?mockButton:id==='status'?{set textContent(v){}}:nodes[id],createElement:()=>({click(){},set href(v){},set download(v){}})};
          const context={document:fakeDocument,Date,TextEncoder,Uint8Array,Blob,URL:fakeUrl,setTimeout:()=>0};
          const exportFn=runInNewContext('const $=id=>document.getElementById(id);'+multiSource+';'+zipHandler+';({download:document.getElementById("downloadPagesZip").onclick})',context,{timeout:2000});
          nodes.pages.value=['Portfolio | Portfolio content','Events | Events content'].join(String.fromCharCode(10));
          await exportFn.download();
          if(!savedBlob)throw new Error('ZIP export did not produce a Blob');
          writeFileSync('/tmp/shane-ci-export.zip',Buffer.from(await savedBlob.arrayBuffer()));
          const check=spawnSync('python3',['-c','import zipfile; z=zipfile.ZipFile("/tmp/shane-ci-export.zip"); assert z.testzip() is None; assert set(z.namelist())=={"index.html","portfolio.html","events.html"}; assert b"Portfolio content" in z.read("portfolio.html"); assert b"Events content" in z.read("events.html")'],{encoding:'utf8'});
          if(check.status!==0)throw new Error('ZIP archive failed extraction test: '+check.stderr);
          if(!builder.includes('id="confirmPublicContent"')||!builder.includes('confirmPublicContent").checked'))throw new Error('Publishing requires public-content review confirmation');
          if(!builder.includes('const approvedContent=JSON.stringify(getSite())')||!builder.includes('if(!reviewStillValid())'))throw new Error('Publishing must reject stale or switched reviewed content');
          const publishHandler=builder.slice(builder.indexOf('document.getElementById("publishSite").onclick='),builder.indexOf('document.getElementById("unpublishSite").onclick='));
          if(publishHandler.includes('.eq("id",selectedSiteId)')||!publishHandler.includes('.eq("id",approvedSiteId)')||!publishHandler.includes('if(selectedSiteId===approvedSiteId)'))throw new Error('Publishing must target the reviewed project and avoid mutating a switched editor');
          const updateHandler=builder.slice(builder.indexOf('document.getElementById("updateSite").onclick='),builder.indexOf('document.getElementById("saveSite").onclick='));
          if(updateHandler.includes('.eq("id",selectedSiteId)')||!updateHandler.includes('.eq("id",editingSiteId)')||!updateHandler.includes('JSON.stringify(getSite())!==JSON.stringify(content)'))throw new Error('Saving edits must target original project and reject changed editor content');
          const newSaveHandler=builder.slice(builder.indexOf('document.getElementById("saveSite").onclick='),builder.indexOf('document.getElementById("newBlankSite").onclick='));
          if(!newSaveHandler.includes('selectedSiteId===sourceProjectId&&JSON.stringify(getSite())===JSON.stringify(site)'))throw new Error('Creating a private copy must not replace a different active editor');
          const duplicateHandler=builder.slice(builder.indexOf('document.getElementById("duplicateSite").onclick='),builder.indexOf('async function verifyPublicSite('));
          if(!duplicateHandler.includes('selectedSiteId===sourceProjectId&&JSON.stringify(getSite())===JSON.stringify(originalContent)'))throw new Error('Duplicating a website must not overwrite a switched editor');
          if(!builder.includes('id="autoPreview"')||!builder.includes('function scheduleAutoPreview(event)')||!builder.includes('clearTimeout(autoPreviewTimer)'))throw new Error('Optional debounced live preview wiring missing');
          if(!builder.includes('id="workspaceNextAction"')||!builder.includes('Suggested next step: Save my progress'))throw new Error('Workspace next-action guidance missing');
          if(!builder.includes('function update(silent=false)')||!builder.includes('update(true);document.getElementById("autoPreviewStatus")'))throw new Error('Automatic preview must preserve important save and publish status messages');
          if(!builder.includes('new Set([...fieldIds,"contact","brandColor","useBrandColor","brandFont","layoutStyle","backgroundStyle","backgroundColor","backgroundColor2"])'))throw new Error('Editor recovery must cover all website content and design fields');
          if(!builder.includes('document.getElementById(id).value=typeof content[id]==="string"?content[id]:""'))throw new Error('Loading older projects must clear fields missing from their saved content');
          if(!builder.includes('content.brandColor:"#2458a6"'))throw new Error('Loading older projects must reset missing brand colors');
          // Exercise actual project loading: fields and colors must never leak across projects.
          const putStart=source.indexOf('function putSite(content){');
          const putEnd=source.indexOf('async function refreshSites(){',putStart);
          if(putStart<0||putEnd<putStart)throw new Error('Project loading function missing');
          const projectIds=['business','tagline','about','services','pages','email','color','faq','testimonials','callToAction','gallery'];
          const projectNodes=Object.fromEntries([...projectIds,'contact','brandColor','useBrandColor','brandFont','layoutStyle','backgroundStyle','backgroundColor','backgroundColor2','preview'].map(id=>[id,{value:'',checked:false,click(){}}]));
          const projectLoader=runInNewContext('const fieldIds='+JSON.stringify(projectIds)+';'+source.slice(putStart,putEnd)+';putSite',{document:{getElementById:id=>projectNodes[id],dispatchEvent:()=>{}},Event:class Event{constructor(type){this.type=type}}},{timeout:2000});
          projectLoader({business:'First project',gallery:'https://example.org/first.jpg | First',faq:'First question | First answer',brandColor:'#ff0000',backgroundColor:'#123456',layoutStyle:'bold'});
          projectLoader({business:'Second project',about:'Only second project content'});
          if(projectNodes.gallery.value||projectNodes.faq.value||projectNodes.brandColor.value!=='#2458a6'||projectNodes.backgroundColor.value!=='#ffffff'||projectNodes.layoutStyle.value!=='classic')throw new Error('Loading a second project leaked content or design from the first');
          if(projectNodes.business.value!=='Second project'||projectNodes.about.value!=='Only second project content')throw new Error('Project loading lost new project content');


          if(!builder.includes('status:"published",slug'))throw new Error('Publishing status missing');
          if(!builder.includes('.update({status:"draft"'))throw new Error('Unpublish status missing');
          if(!viewer.includes('.eq("status","published")'))throw new Error('Public viewer status filter missing');
          if(!viewer.includes('textContent=c.business||c.name||data.name'))throw new Error('Safe public text rendering missing');
          for(const file of pages){
            const html=fs.readFileSync(file,'utf8');
            const ids=[...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
            const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);
            if(duplicates.length)throw new Error(file+' has duplicate element IDs: '+[...new Set(duplicates)].join(', '));
            for(const m of html.matchAll(/document\.getElementById\(["']([^"']+)["']\)/g)){
              if(!ids.includes(m[1]))throw new Error(file+' refers to missing element ID '+m[1]);
            }
          }
          console.log('Validated '+pages.length+' pages and '+checked+' inline scripts plus publishing invariants.');
          NODE
