name: SHANE page syntax
on:
  push:
    paths:
      - 'index.html'
      - 'detangler.html'
      - 'shane-detangler-core.js'
      - 'tests/detangler-core.test.cjs'
      - 'workspace.html'
      - 'members.html'
      - 'my-network.html'
      - 'builder.html'
      - 'site.html'
      - 'dashboard.html'
      - 'network.html'
      - 'scripts/check-page-syntax.cjs'
      - 'tests/vision-journey.spec.cjs'
      - 'tests/endeavor-continuity.spec.cjs'
      - 'shane-connected-workspace.js'
      - 'shane-endeavor-actions.js'
      - '.github/workflows/shane-page-syntax.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  statuses: write
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate inline JavaScript
        run: node scripts/check-page-syntax.cjs
      - name: Verify Detangler diagnostics and safe exports
        run: node --test tests/detangler-core.test.cjs tests/detangler-source-audit.test.cjs tests/shane-acceptance-detangler.test.cjs tests/shane-endeavor-guard.test.cjs
      - name: Install browser test runner
        run: npm install --no-save @playwright/test@1.58.2
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify supported Playwright options
        run: npx playwright test --help | grep -F -- '--trace'
      - name: Run vision journey browser smoke tests
        id: browser
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/shane-http.log 2>&1 &
          npx playwright test tests/vision-journey.spec.cjs tests/endeavor-continuity.spec.cjs --browser chromium --workers 1 --reporter line,json --trace retain-on-failure --timeout 30000 --global-timeout 480000 --retries 0
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8765
          PLAYWRIGHT_JSON_OUTPUT_FILE: /tmp/shane-playwright-results.json
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shane-browser-failure-evidence
          path: |
            test-results/
            /tmp/shane-http.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish retrievable browser acceptance status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const state=process.env.BROWSER_OUTCOME==='success'?'success':'failure';
          const body={
            state,context:'shane/browser-acceptance',
            description:state==='success'?'Browser acceptance suite passed':'Browser suite failed or could not complete; inspect linked run',
            target_url:process.env.RUN_URL
          };
          fetch('https://api.github.com/repos/'+process.env.REPOSITORY+'/statuses/'+process.env.COMMIT_SHA,{
            method:'POST',
            headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},
            body:JSON.stringify(body)
          }).then(async response=>{if(!response.ok)throw Error('Status publication failed: '+response.status+' '+await response.text());console.log('Published browser acceptance status:',state,process.env.RUN_URL)})
            .catch(error=>{console.error(error);process.exitCode=1});
          NODE
      - name: Persist browser acceptance report for connected inspection
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='reports/shane-browser-acceptance-latest.json';
          const url='https://api.github.com/repos/'+process.env.REPOSITORY+'/contents/'+path;
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          const report={commit:process.env.COMMIT_SHA,run_id:process.env.RUN_ID,run_url:'https://github.com/'+process.env.REPOSITORY+'/actions/runs/'+process.env.RUN_ID,outcome:process.env.BROWSER_OUTCOME,created_at:new Date().toISOString()};
          try{
            const data=JSON.parse(fs.readFileSync('/tmp/shane-playwright-results.json','utf8'));
            report.summary={expected:data.stats?.expected,passed:data.stats?.expected-data.stats?.unexpected-data.stats?.flaky-data.stats?.skipped,failed:data.stats?.unexpected,flaky:data.stats?.flaky,skipped:data.stats?.skipped};
            const failures=[];
            function walk(suites){for(const suite of suites||[]){for(const spec of suite.specs||[]){for(const test of spec.tests||[]){if(test.status==='unexpected'||test.results?.some(r=>r.status==='failed'||r.status==='timedOut'))failures.push({title:spec.title,file:spec.file,line:spec.line,errors:(test.results||[]).flatMap(r=>(r.errors||[]).map(e=>e.message)).slice(0,2)});}}walk(suite.suites)}}
            walk(data.suites);report.failures=failures;
          }catch(e){report.report_error=String(e)}
          async function api(method,body){const res=await fetch(url,{method,headers,body:body&&JSON.stringify(body)});if(res.status===404&&method==='GET')return null;if(!res.ok)throw Error(method+' report failed '+res.status+': '+await res.text());return res.json()}
          (async()=>{const existing=await api('GET');await api('PUT',{message:'Record latest SHANE browser acceptance result [skip ci]',content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),...(existing?.sha?{sha:existing.sha}:{})});console.log('Published browser acceptance report',JSON.stringify(report.summary||report))})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
