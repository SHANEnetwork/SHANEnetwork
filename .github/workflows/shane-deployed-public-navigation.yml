name: SHANE deployed public navigation (no account)
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * 1'
permissions:
  contents: read
jobs:
  deployed-public-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify deployed public navigation
        run: node tests/shane-deployed-public-navigation.cjs
        env:
          SHANE_E2E_URL: https://shanenetwork.org
