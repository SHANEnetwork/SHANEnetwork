name: SHANE integration regression
on:
  push:
    branches: [main, feature/reusable-composition-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  network-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integration JavaScript syntax
        run: |
          node --check shane-network-connector.js
          node --check shane-conversation-sync.js
          node --check shane-creator-network-bridge.js
          node --check shane-capability-manifest.js
          node --check shane-endeavor-diagnostics.js
          node --check shane-endeavor-access.js
          node --check shane-endeavor-orchestrator.js
          node --check shane-invitations.js
          node --check shane-collaborators.js
          node --check shane-collaborator-panel.js
          node --check shane-revocation.js
      - name: Check website lifecycle and inline page scripts
        run: node tests/website-lifecycle.cjs
      - name: Check shared direction refresh regression
        run: node tests/workspace-overview-refresh-regression.cjs
      - name: Check collaboration workspace feed refresh regression
        run: node tests/workspace-feed-refresh-regression.cjs
      - name: Check task edit preservation
        run: node tests/workspace-task-edit-preservation.cjs
      - name: Check collaboration task refresh regression
        run: node tests/workspace-task-refresh-regression.cjs
      - name: Check private conversation refresh regression
        run: node tests/conversation-refresh-regression.cjs
      - name: Test listing save experience
        run: node --test tests/listing-save-experience.cjs
      - name: Check database RLS regression scripts are tracked
        run: |
          test -s database/test/shane-collaboration-rls-regression.sql
          test -s database/test/shane-collaboration-negative-rls.sql
          grep -q 'ROLLBACK;' database/test/shane-collaboration-rls-regression.sql
          grep -q 'ROLLBACK;' database/test/shane-collaboration-negative-rls.sql
      - name: Test endeavor network privacy and publication
        run: node --test tests/endeavor-network-lifecycle.cjs tests/endeavor-diagnostics.cjs tests/endeavor-access.cjs tests/endeavor-orchestrator.cjs tests/creator-integration-wiring.cjs tests/endeavor-invitation-sql.cjs tests/endeavor-invitations.cjs tests/invitation-inbox-races.cjs tests/endeavor-membership-consent.cjs tests/endeavor-revocation.cjs tests/endeavor-revocation-sql.cjs tests/endeavor-collaborators.cjs tests/collaboration-security-wiring.cjs tests/two-member-collaboration-model.cjs
