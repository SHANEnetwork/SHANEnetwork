name: SHANE integration regression
on:
  push:
    branches: [main, feature/reusable-composition-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check integration JavaScript syntax
        run: |
          node --check shane-network-connector.js
          node --check shane-conversation-sync.js
          node --check shane-creator-network-bridge.js
          node --check shane-capability-manifest.js
          node --check shane-endeavor-diagnostics.js
      - name: Check dashboard inline module syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('dashboard.html','utf8');
          const modules=[...html.matchAll(/<script\\b[^>]*type=["']module["'][^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if(!modules.length)throw Error('Dashboard module script missing');
          for(const match of modules)new vm.SourceTextModule(match[1]);
          console.log('Dashboard module syntax valid');
          NODE
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - name: Test endeavor network privacy and publication
        run: node --test tests/endeavor-network-lifecycle.cjs tests/endeavor-diagnostics.cjs
