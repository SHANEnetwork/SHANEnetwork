name: Reusable composition contracts
on:
  push:
    paths:
      - 'shane-composition.js'
      - 'tests/composition.cjs'
      - '.github/workflows/composition.yml'
  pull_request:
    paths:
      - 'shane-composition.js'
      - 'tests/composition.cjs'
      - '.github/workflows/composition.yml'
jobs:
  composition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/composition.cjs
