name: Reusable composition contracts
on:
  push:
    paths:
      - 'builder.html'
      - 'shane-builder-bridge.js'
      - 'tests/builder-bridge.cjs'
      - 'tests/builder-primary-action.cjs'
      - 'shane-composition.js'
      - 'shane-compatibility.js'
      - 'tests/compatibility.cjs'
      - 'shane-outreach.js'
      - 'tests/outreach.cjs'
      - 'tests/composition.cjs'
      - 'tests/vision.cjs'
      - 'shane-vision.js'
      - 'shane-endeavor-adapter.js'
      - 'tests/endeavor-adapter.cjs'
      - 'shane-endeavor-store.js'
      - 'tests/endeavor-store.cjs'
      - 'shane-conversation-state.js'
      - 'tests/conversation-state.cjs'
      - 'shane-conversation-sync.js'
      - 'shane-provision.js'
      - 'tests/provision.cjs'
      - 'shane-organization-provision.js'
      - 'tests/organization-provision.cjs'
      - '.github/workflows/composition.yml'
  pull_request:
    paths:
      - 'shane-composition.js'
      - 'tests/composition.cjs'
      - 'shane-compatibility.js'
      - 'tests/compatibility.cjs'
      - 'shane-outreach.js'
      - 'tests/outreach.cjs'
      - '.github/workflows/composition.yml'
jobs:
  composition:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/builder-primary-action.cjs
      - run: node --check shane-conversation-sync.js
      - run: node --check shane-provision.js
      - run: node --check shane-builder-bridge.js
      - run: node tests/composition.cjs
      - run: node tests/compatibility.cjs
      - run: node tests/outreach.cjs
      - run: node tests/vision.cjs
      - run: node tests/endeavor-adapter.cjs
      - run: node tests/conversation-state.cjs
      - run: node tests/endeavor-store.cjs
      - run: node tests/provision.cjs
      - run: node tests/organization-provision.cjs
      - run: node tests/builder-bridge.cjs
