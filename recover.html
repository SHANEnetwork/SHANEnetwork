<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover account | SHANEnetwork</title><style>body{font:16px system-ui,sans-serif;background:#fff9f4;color:#342b3a;margin:0}header{background:linear-gradient(110deg,#704b68,#c47c83);color:white;padding:22px max(20px,calc((100vw - 700px)/2))}header a{color:white}main{max-width:700px;margin:32px auto;padding:0 20px}section{padding:25px;border:1px solid #e5d6d8;background:white;border-radius:16px}label{display:block;margin:16px 0}input{font:inherit;width:100%;padding:12px;box-sizing:border-box;margin-top:6px}button{font:inherit;padding:12px 18px;background:#704b68;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}a{color:#694266}#status{min-height:2em}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shane-theme.js" defer></script><link rel="stylesheet" href="shane-world.css"><link rel="stylesheet" href="shane-unified-experience.css"><script src="shane-unified-navigation.js" defer></script></head><body><header><a href="members.html">← Back to members</a><h1>Choose a new password</h1></header><main><section><p>Open this page using the recovery link sent to your email. If you do not have a link, request one on the Members page.</p><p id="status" role="status" aria-live="polite">Checking your recovery link…</p><form id="recoveryForm" hidden><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirm new password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button type="submit">Update password</button></form><p><a href="members.html">Return to member sign-in</a></p></section></main><script>
const sb=supabase.createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB');
const status=document.getElementById('status'),form=document.getElementById('recoveryForm');
let recoveryAuthorized=false;
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryAuthorized=true;form.hidden=false;status.textContent='Recovery link accepted. Choose a new password.'}});
(async()=>{try{const url=new URL(location.href);const error=url.searchParams.get('error_description')||url.searchParams.get('error');if(error){status.textContent='Recovery link error: '+error;return}if(url.searchParams.get('token_hash')&&url.searchParams.get('type')==='recovery'){const {error:verifyError}=await sb.auth.verifyOtp({token_hash:url.searchParams.get('token_hash'),type:'recovery'});if(verifyError){status.textContent='Recovery link could not be verified: '+verifyError.message;return}recoveryAuthorized=true}if(location.hash.includes('type=recovery')){status.textContent='Validating recovery link…';const {data,error:sessionError}=await sb.auth.getSession();if(sessionError){status.textContent='Recovery link could not be verified: '+sessionError.message;return}if(data.session)recoveryAuthorized=true}if(recoveryAuthorized){form.hidden=false;status.textContent='Recovery link accepted. Choose a new password.'}else{status.textContent='No active recovery link found. Request a new link on the Members page.'}}catch(e){status.textContent='Unable to check the recovery link: '+e.message}})();
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryAuthorized){status.textContent='Please open a valid recovery link first.';return}const password=document.getElementById('newPassword').value;if(password!==document.getElementById('confirmPassword').value){status.textContent='The passwords do not match.';return}const button=form.querySelector('button');button.disabled=true;try{const {error}=await sb.auth.updateUser({password});if(error){status.textContent='Could not update password: '+error.message;return}form.hidden=true;status.textContent='Password updated. You can return to Members to sign in.';await sb.auth.signOut()}catch(err){status.textContent='Unable to update password: '+err.message}finally{button.disabled=false}});
</script></body></html>
