ublished."}else{const c=data.content||{};document.title=(data.name||"Website")+" | SHANEnetwork";document.getElementById("name").textContent=c.business||c.name||data.name;document.getElementById("tagline").textContent=c.tagline||"";const color=/^#[0-9a-fA-F]{6}$/.test(c.color)?c.color:"#225e9a";document.getElementById("hero").style.backgroundColor=color;const nav=document.getElementById("nav"),main=document.getElementById("main");const pages=[{title:"Home",body:c.about||""},...(typeof c.pages==="string"?c.pages.split(/\r?\n/).filter(Boolean).slice(0,8).map(line=>{const i=line.indexOf("|");return{title:(i<0?line:line.slice(0,i)).trim()||"Page",body:i<0?"":line.slice(i+1).trim()}}):[])];function show(n){if(!Number.isInteger(n)||n<0||n>=pages.length)n=0;main.replaceChildren();const h=document.createElement("h2");h.textContent=pages[n].title;const p=document.createElement("p");p.textContent=pages[n].body;main.append(h,p);if(n===0){const services=String(c.services||"").split(/\r?\n/).filter(Boolean);if(services.length){const h2=document.createElement("h2");h2.textContent="What we offer";const ul=document.createElement("ul");for(const service of services){const li=document.createElement("li");li.textContent=service;ul.append(li)}main.append(h2,ul)}if(c.contact!==false&&c.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email)){const a=document.createElement("a");a.href="mailto:"+encodeURIComponent(c.email).replace(/%40/g,"@");a.textContent="Contact us";main.append(a)}}for(const [i,b]of [...nav.children].entries())b.setAttribute("aria-current",i===n?"page":"false")}pages.forEach((page,i)=>{const b=document.createElement("button");b.type="button";b.textContent=page.title;b.onclick=()=>{show(i);const url=new URL(location.href);if(i)url.searchParams.set('page',String(i));else url.searchParams.delete('page');history.replaceState(null,'',url)};nav.append(b)});const requested=Number(params.get('page')||0);show(Number.isSafeInteger(requested)?requested:0);message.hidden=true;document.g
