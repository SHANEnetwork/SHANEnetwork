<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Opportunities | SHANE</title><style>body{font:16px/1.5 system-ui;max-width:850px;margin:auto;padding:24px;color:#173858;background:#f4f8ff}header,section,article{background:white;border:1px solid #d9e3f1;border-radius:12px;padding:18px;margin:14px 0}header{background:linear-gradient(110deg,#2c629f,#7c87ca);color:white}header a{color:white}label{display:block;margin:10px 0}select,input,textarea{font:inherit;padding:10px;width:100%;box-sizing:border-box}button{padding:10px 15px;background:#245d98;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px}button:disabled{opacity:.5}.muted{color:#586b7d}</style><header><h1>Community Opportunities</h1><a href="index.html">Home</a> · <a href="communities.html">Manage communities</a> · <a href="community-feed.html">Updates</a></header><p>Coordinate volunteers, committees, shared activities, and other ways members can participate.</p><p id="status" role="status" aria-live="polite"></p><section><label>Community<select id="org"></select></label><form id="create" hidden><h2>Offer an opportunity</h2><label>Title<input id="title" required minlength="2" maxlength="160"></label><label>Details<textarea id="description" maxlength="4000"></textarea></label><label>Places available (optional)<input id="slots" type="number" min="1" max="100000"></label><button id="add">Create opportunity</button></form><button id="refresh">Refresh</button></section><div id="items"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';const sb=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB'),$=id=>document.getElementById(id);let user,owned=new Set();async function init(){const{data:{user:u}}=await sb.auth.getUser();user=u;if(!user){$('status').textContent='Sign in on the Member account page first.';return}const[a,b]=await Promise.all([sb.from('shane_organizations').select('id,name').eq('owner_id',user.id),sb.from('shane_organization_members').select('organization_id').eq('user_id',user.id)]);if(a.error||b.error){$('status').textContent=(a.error||b.error).message;return}owned=new Set(a.data.map(x=>x.id));const ids=[...new Set([...owned,...b.data.map(x=>x.organization_id)])];if(!ids.length){$('status').textContent='Create or join a community first.';return}const{data,error}=await sb.from('shane_organizations').select('id,name').in('id',ids);if(error){$('status').textContent=error.message;return}for(const org of data){const option=document.createElement('option');option.value=org.id;option.textContent=org.name;$('org').append(option)}const requested=new URLSearchParams(location.search).get('organization');if(ids.includes(requested))$('org').value=requested;await refresh()}async function refresh(){const id=$('org').value,host=$('items');$('create').hidden=!owned.has(id);host.replaceChildren();if(!id)return;const{data,error}=await sb.from('shane_organization_opportunities').select('id,title,description,slots,created_at').eq('organization_id',id).order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent=error.message;return}if(!data.length){host.textContent='No opportunities posted yet.';return}for(const item of data){const article=document.createElement('article'),title=document.createElement('h3'),description=document.createElement('p'),count=document.createElement('p'),action=document.createElement('button');title.textContent=item.title;description.textContent=item.description;count.className='muted';count.textContent='Loading signups…';article.append(title,description,count,action);const {data:signups,error:signupError}=await sb.from('shane_organization_signups').select('user_id').eq('opportunity_id',item.id);if(signupError){count.textContent='Signup status unavailable: '+signupError.message;action.disabled=true}else{const joined=signups.some(x=>x.user_id===user.id);count.textContent=owned.has(id)?signups.length+' signed up'+(item.slots?' · '+item.slots+' places available':''):joined?'You are signed up':item.slots?'Capacity: '+item.slots:'Open signup';action.textContent=joined?'Withdraw':'Sign up';action.onclick=async()=>{action.disabled=true;const{error:e}=joined?await sb.from('shane_organization_signups').delete().eq('opportunity_id',item.id).eq('user_id',user.id):await sb.from('shane_organization_signups').insert({opportunity_id:item.id,user_id:user.id});$('status').textContent=e?'Signup failed: '+e.message:joined?'Signup withdrawn.':'Signed up.';await refresh()}}if(owned.has(id)){const remove=document.createElement('button');remove.textContent='Remove opportunity';remove.onclick=async()=>{if(!confirm('Remove this opportunity and its signups?'))return;const{error:e}=await sb.from('shane_organization_opportunities').delete().eq('id',item.id);$('status').textContent=e?e.message:'Opportunity removed.';await refresh()};article.append(remove)}host.append(article)}}$('org').onchange=refresh;$('refresh').onclick=refresh;$('create').onsubmit=async e=>{e.preventDefault();const slots=$('slots').value;const{error}=await sb.from('shane_organization_opportunities').insert({organization_id:$('org').value,creator_id:user.id,title:$('title').value.trim(),description:$('description').value.trim(),slots:slots?Number(slots):null});$('status').textContent=error?'Unable to create: '+error.message:'Opportunity created.';if(!error){$('create').reset();await refresh()}};init();</script></html>
