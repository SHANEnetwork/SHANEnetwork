<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuration history | SHANE</title><style>body{font:16px/1.5 system-ui;max-width:850px;margin:auto;padding:24px;background:#f5f8ff;color:#173858}main,article{background:white;padding:20px;margin:16px 0;border:1px solid #d7e3f2;border-radius:12px}select,button{padding:12px;font:inherit}button{background:#225e9a;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef5ff;padding:12px}a{color:#164a7c}</style><link rel="stylesheet" href="shane-world.css"></head><body><nav><a href="communities.html">My Communities</a> · <a href="members.html">Account</a></nav><main><h1>Configuration history and rollback</h1><p>Preview past organization settings and restore a previous version. Existing members, posts, events, and discussions are not deleted by this operation. A restoration creates a new history version.</p><label for="org">Your organization</label> <select id="org"></select><p id="status" role="status"></p><div id="versions"></div></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB'),$=id=>document.getElementById(id);
async function load(){const id=$('org').value;$('versions').replaceChildren();if(!id){$('status').textContent='Select an organization.';return}const {data,error}=await sb.from('shane_organization_config_versions').select('version_number,configuration,created_at,change_note').eq('organization_id',id).order('version_number',{ascending:false}).limit(100);if(error){$('status').textContent=error.message;return}$('status').textContent=data.length+' saved versions';for(const item of data){const article=document.createElement('article'),title=document.createElement('h2');title.textContent='Version '+item.version_number;article.append(title);const date=document.createElement('p');date.textContent=new Date(item.created_at).toLocaleString()+' · '+item.change_note;article.append(date);const details=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='Preview configuration';pre.textContent=JSON.stringify(item.configuration,null,2);details.append(summary,pre);article.append(details);const btn=document.createElement('button');btn.textContent='Restore version '+item.version_number;btn.disabled=item===data[0];btn.onclick=async()=>{if(!confirm('Restore version '+item.version_number+'? This changes settings but preserves existing community content.'))return;btn.disabled=true;const r=await sb.rpc('shane_restore_organization_config',{p_organization_id:id,p_version_number:item.version_number});if(r.error){$('status').textContent='Restore failed: '+r.error.message;btn.disabled=false}else{await load();$('status').textContent='Restored version '+item.version_number+'; saved as version '+r.data+'.'}};article.append(btn);$('versions').append(article)}}
const auth=await sb.auth.getUser();if(!auth.data.user){$('status').textContent='Sign in through the member page first.'}else{const r=await sb.from('shane_organizations').select('id,name').eq('owner_id',auth.data.user.id).order('name');if(r.error)$('status').textContent=r.error.message;else{for(const org of r.data)$('org').append(new Option(org.name,org.id));const requested=new URLSearchParams(location.search).get('organization');if(requested&&r.data.some(x=>x.id===requested))$('org').value=requested;$('org').onchange=load;await load()}}
</script></body></html>
