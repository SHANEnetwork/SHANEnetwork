<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your conversation history | SHANE</title><link rel="stylesheet" href="shane-world.css"><link rel="stylesheet" href="shane-unified-experience.css">
<style>main{max-width:950px;margin:auto;padding:28px 18px 80px}h1{font-family:Georgia,serif}article{background:#fffaf7;color:#382d35;border:1px solid #d7bfc7;border-radius:17px;padding:18px;margin:14px 0}article p{white-space:pre-wrap;overflow-wrap:anywhere}button,a.action{border-radius:20px;padding:9px 14px;margin:4px;background:#715067;color:white;border:0;cursor:pointer}button:focus-visible{outline:3px solid orange}#history-list{min-height:80px}.muted{opacity:.8;font-size:.9rem}label{display:inline-flex;gap:7px;align-items:center}</style></head>
<body><header><a href="index.html">SHANE Network</a></header><main><h1>Our conversations, always yours</h1><p>Return to ideas, decisions, and unfinished work. Archiving hides an entry without deleting it. Deletion requires confirmation.</p>
<div><label for="history-search">Search conversations</label> <input id="history-search" type="search" placeholder="Find an idea or decision"> <button id="search-button" type="button">Search</button> <label for="endeavor-filter">Endeavor</label> <select id="endeavor-filter"><option value="">All endeavors</option></select> <label><input id="include-archived" type="checkbox"> Show archived entries</label> <button id="refresh" type="button">Refresh history</button><button id="export" type="button">Export all history</button></div>
<p id="status" role="status">Connecting to your account…</p><div id="history-list" aria-live="polite"></div><button id="more" type="button" hidden>Load earlier entries</button></main>
<script src="shane-unified-navigation.js" defer></script><script type="module">
const $=id=>document.getElementById(id),list=$("history-list"),status=$("status");let offset=0;
async function store(){for(let i=0;i<30&&!window.SHANEConversationStore;i++)await new Promise(resolve=>setTimeout(resolve,100));if(!window.SHANEConversationStore)throw Error("Conversation storage is unavailable.");return window.SHANEConversationStore}
function item(entry){const article=document.createElement("article"),heading=document.createElement("div"),body=document.createElement("p"),actions=document.createElement("div");const time=new Date(entry.created_at);heading.className="muted";heading.textContent=(Number.isNaN(time.getTime())?"Saved":time.toLocaleString())+" · "+entry.source_page+(entry.archived_at?" · Archived":"");body.textContent=entry.body;const archive=document.createElement("button");archive.type="button";archive.textContent=entry.archived_at?"Restore":"Archive";archive.addEventListener("click",async()=>{try{await (await store()).setArchived(entry.id,!entry.archived_at);await load(true)}catch(error){status.textContent=error.message}});const remove=document.createElement("button");remove.type="button";remove.textContent="Delete";remove.addEventListener("click",async()=>{if(!confirm("Permanently delete this conversation entry?"))return;try{await (await store()).remove(entry.id);await load(true)}catch(error){status.textContent=error.message}});const continueButton=document.createElement("button");continueButton.type="button";continueButton.textContent="Continue this idea";continueButton.addEventListener("click",()=>{
 try{
  sessionStorage.setItem("shane-creative-handoff-v1",JSON.stringify({text:entry.body,created:Date.now()}));
  if(entry.endeavor_id)sessionStorage.setItem("shane-active-endeavor-v1",JSON.stringify({id:entry.endeavor_id,updated:Date.now()}));
  location.href="builder.html#shane-idea-conversation";
 }catch(error){status.textContent="Unable to continue this idea: "+error.message}
});
actions.append(continueButton,archive,remove);article.append(heading,body,actions);return article}
async function load(reset=false){if(reset){offset=0;list.replaceChildren()}status.textContent="Loading your saved conversations…";try{const term=$("history-search").value.trim();
const api=await store();
const entries=term?await api.searchHistory(term,{limit:50,offset,endeavorId:$("endeavor-filter").value||null,includeArchived:$("include-archived").checked}):await api.list({limit:50,offset,includeArchived:$("include-archived").checked,endeavorId:$("endeavor-filter").value||null});for(const entry of entries)list.append(item(entry));offset+=entries.length;$("more").hidden=entries.length<50;status.textContent=offset?offset+" saved entries loaded.":"No saved entries in this view yet."}catch(error){status.textContent=error.message;$("more").hidden=true}}
async function populateEndeavors(){
 try{
  const rows=await (await store()).endeavors();
  for(const entry of rows){const option=document.createElement("option");option.value=entry.id;option.textContent=entry.title||"Untitled endeavor";$("endeavor-filter").append(option)}
 }catch{}
}
$("endeavor-filter").addEventListener("change",()=>load(true));
void populateEndeavors();
$("search-button").addEventListener("click",()=>load(true));
$("history-search").addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();void load(true)}});
$("refresh").addEventListener("click",()=>load(true));$("include-archived").addEventListener("change",()=>load(true));$("more").addEventListener("click",()=>load());$("export").addEventListener("click",async()=>{try{status.textContent="Preparing your complete history…";const data=await(await store()).exportHistory();const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download="shane-conversation-history.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),3000);status.textContent="History export prepared."}catch(error){status.textContent=error.message}});void load(true);
</script></body></html>
