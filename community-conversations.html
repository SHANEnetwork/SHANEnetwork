<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHANE Community Conversations</title><style>body{font:16px/1.55 system-ui;max-width:850px;margin:auto;padding:24px;background:#f5f8ff;color:#183858}header,section,article{background:white;border:1px solid #d9e4f0;border-radius:12px;padding:18px;margin:14px 0}header{background:linear-gradient(110deg,#285e9b,#7786c8);color:white}header a{color:white}label{display:block;margin:12px 0}select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid #9aadc4;border-radius:8px}button{font:inherit;background:#225d99;color:white;padding:10px 15px;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#52667d}a{color:#225d99}</style><link rel="stylesheet" href="shane-world.css"><header><h1>Community Conversations</h1><a href="index.html">Home</a> · <a href="communities.html">Manage communities</a> · <a href="community-feed.html">Updates</a> · <a href="members.html">Sign in</a></header><p>Discuss ideas and coordinate with accepted members of your communities. Conversations are not public.</p><p id="status" role="status" aria-live="polite"></p><section><label>Community<select id="org"></select></label><form id="form"><label>Your message<textarea id="body" maxlength="3000" required placeholder="Share an idea, question, or update with your community."></textarea></label><button id="send">Post to community</button></form><button id="refresh" type="button">Refresh conversation</button></section><div id="messages" aria-live="polite"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm';const sb=createClient('https://ufxzogeixdwvbpdypojb.supabase.co','sb_publishable_iR9kxdCfQ7850VleEUx7mA_nHS4WZpB'),$=id=>document.getElementById(id);let user,enabled=new Map();async function init(){const{data:{user:account}}=await sb.auth.getUser();user=account;if(!user){$('status').textContent='Sign in on the Member account page first.';$('send').disabled=true;return}const[owned,joined]=await Promise.all([sb.from('shane_organizations').select('id,name').eq('owner_id',user.id),sb.from('shane_organization_members').select('organization_id').eq('user_id',user.id)]);if(owned.error||joined.error){$('status').textContent=(owned.error||joined.error).message;return}const ids=[...new Set([...owned.data.map(x=>x.id),...joined.data.map(x=>x.organization_id)])];if(!ids.length){$('status').textContent='Create a community or accept an invitation to participate.';$('send').disabled=true;return}const{data,error}=await sb.from('shane_organizations').select('id,name,settings').in('id',ids);if(error){$('status').textContent=error.message;return}enabled=new Map(data.map(o=>[o.id,o.settings?.rooms==='on']));for(const org of data){const option=document.createElement('option');option.value=org.id;option.textContent=org.name;$('org').append(option)}const requested=new URLSearchParams(location.search).get('organization');if(ids.includes(requested))$('org').value=requested;await refresh()}async function refresh(){const org=$('org').value,host=$('messages');host.replaceChildren();if(!org)return;const open=enabled.get(org)===true;$('send').disabled=!open;$('body').disabled=!open;$('status').textContent=open?'Community discussions are enabled.':'Community discussions are disabled by this organization. You can still read existing messages.';const{data,error}=await sb.from('shane_organization_discussions').select('id,sender_id,body,created_at').eq('organization_id',org).order('created_at',{ascending:false}).limit(100);if(error){$('status').textContent=error.message;return}if(!data.length){host.textContent='No conversation yet. Start one!';return}for(const item of data){const article=document.createElement('article'),meta=document.createElement('p'),body=document.createElement('p');meta.className='muted';meta.textContent=(item.sender_id===user.id?'You':'Community member')+' · '+new Date(item.created_at).toLocaleString();body.textContent=item.body;article.append(meta,body);if(item.sender_id===user.id){const button=document.createElement('button');button.textContent='Delete';button.onclick=async()=>{if(!confirm('Delete your message?'))return;const{error}=await sb.from('shane_organization_discussions').delete().eq('id',item.id);$('status').textContent=error?error.message:'Message deleted.';await refresh()};article.append(button)}host.append(article)}}$('form').onsubmit=async e=>{e.preventDefault();if(!user||!$('org').value||!enabled.get($('org').value))return;$('send').disabled=true;const{error}=await sb.from('shane_organization_discussions').insert({organization_id:$('org').value,sender_id:user.id,body:$('body').value.trim()});$('status').textContent=error?'Post failed: '+error.message:'Message posted.';if(!error){$('body').value='';await refresh()}$('send').disabled=false};$('refresh').onclick=refresh;$('org').onchange=refresh;init();</script></html>
